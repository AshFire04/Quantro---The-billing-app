{% extends "base.html" %}
{% block title %}{{ 'Edit product' if editing else 'Add product' }}{% endblock %}
{% block main_class %}page medium{% endblock %}
{% block content %}
<h1>{{ 'Edit product' if editing else 'Add product' }}</h1>
<form method="post" class="card form">
  <div class="form-cols">
  <div>
  <label>Item Code/Bar Code (optional)
    <input name="code" value="{{ product.code or '' }}" placeholder="e.g. KA36 or scan a bar code">
  </label>
  <label>Name
    <input name="name" value="{{ product.name or '' }}" required placeholder="e.g. Tray 9.5 x 9.5 x 1.5">
  </label>
  <label>Category
    <select name="category">
      <option value="">No category</option>
      {% for c in category_choices %}<option{{ ' selected' if c == product.category }}>{{ c }}</option>{% endfor %}
      {% if product.category and product.category not in category_choices %}<option selected>{{ product.category }}</option>{% endif %}
    </select>
    {% if not category_choices %}<small class="muted">Add categories in <a href="{{ url_for('settings.index') }}#categories">Shop Details</a>.</small>{% endif %}
  </label>
  <label>Selling Price (₹)
    <input name="price" inputmode="decimal" value="{{ product.price or '' }}" required>
  </label>
  <label>Stock
    <input name="stock" type="number" min="0" step="1" value="{{ product.stock if product.stock is not none else 0 }}" required>
  </label>
  <label>Low-stock level (shows "Low" at or below this)
    <input name="low_stock_level" type="number" min="0" step="1" value="{{ product.low_stock_level if product.low_stock_level is not none else 5 }}" required>
  </label>
  </div>
  <div>
  <label>HSN/SAC number (optional)
    <input name="hsn" inputmode="numeric" maxlength="8" value="{{ product.hsn or '' }}" placeholder="e.g. 9403">
  </label>
  <label>Supplier name
    <select name="supplier">
      <option value="">No supplier</option>
      {% for s in supplier_choices %}<option{{ ' selected' if s == product.supplier }}>{{ s }}</option>{% endfor %}
      {% if product.supplier and product.supplier not in supplier_choices %}<option selected>{{ product.supplier }}</option>{% endif %}
    </select>
    {% if not supplier_choices %}<small class="muted">Add suppliers in <a href="{{ url_for('settings.index') }}#suppliers">Shop Details</a>.</small>{% endif %}
  </label>
  <label>Cost price (₹)
    <input name="cost_price" inputmode="decimal" value="{{ product.cost_price or '' }}" placeholder="What it costs you">
  </label>
  <label>GST % (already included in the price)
    <input name="gst_rate" inputmode="decimal" value="{{ product.gst_rate if product.gst_rate is not none else '' }}" placeholder="0">
  </label>
  </div>
  </div>
  <button class="btn primary" type="submit">Save product</button>
  <a class="btn" href="{{ url_for('inventory.index') }}">Cancel</a>
</form>
{% endblock %}
